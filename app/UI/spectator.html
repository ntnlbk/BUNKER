<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNKER | Observation Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0c0a09; }
        ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 3px; }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-200 overflow-hidden">

    <!-- Header -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800 bg-slate-950/80">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-eye text-slate-400 text-2xl animate-pulse"></i>
            <span class="font-mono text-xl font-bold tracking-widest text-slate-300">BUNKER // OBSERVATION DECK</span>
        </div>
        <div class="font-mono text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded border border-slate-800">
            ROOM: <span id="headerRoomCode">---</span> | ROLE: SPECTATOR
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 p-6 overflow-hidden">
        
        <!-- Left 2 Cols: Live Feed & Stats -->
        <div class="md:col-span-2 bg-slate-900 border-2 border-slate-700 rounded-2xl p-6 flex flex-col overflow-y-auto">
            <h2 class="text-2xl font-bold text-slate-300 font-mono mb-2"><i class="fa-solid fa-satellite-dish mr-2"></i>LIVE SIMULATION FEED</h2>
            <p class="text-xs text-slate-400 font-mono mb-6">You are watching the bunker trials. Voting rights are disabled.</p>

            <div class="bg-slate-950 p-5 rounded-xl border border-slate-800 font-mono space-y-4">
                <h3 class="text-sm font-bold text-slate-300 uppercase">Observer Log</h3>
                <div class="text-xs text-slate-400 space-y-2">
                    <p class="text-slate-500">[00:00] Simulation initialized.</p>
                    <p class="text-slate-400">[00:05] Survivors connected and briefing commenced.</p>
                </div>
            </div>
        </div>

        <!-- Right Col: WebSocket Chat (Read-only or active) -->
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-4 flex flex-col h-full overflow-hidden">
            <h3 class="text-sm font-mono text-slate-400 uppercase tracking-wider mb-2 border-b border-slate-800 pb-2">
                <i class="fa-solid fa-comments mr-2"></i>Spectator Feed
            </h3>
            <div id="chatBox" class="flex-1 overflow-y-auto font-mono text-xs space-y-2 p-3 bg-slate-950 rounded border border-slate-800 mb-3"></div>
            <form onsubmit="sendChatMessage(event)" class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Send observation..." required class="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-slate-500">
                <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded font-mono text-xs font-bold transition-colors">SEND</button>
            </form>
        </div>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomCode = params.get('code') || sessionStorage.getItem('roomCode') || 'BNK-0000';
        const currentUsername = params.get('player') || sessionStorage.getItem('playerName') || 'Spectator';
        document.getElementById('headerRoomCode').innerText = roomCode;

        let ws;
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${roomCode}/${encodeURIComponent(currentUsername)}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "CHAT") {
                    appendChatMessage(data.sender, data.message);
                }
            };
            ws.onclose = () => setTimeout(initWebSocket, 2000);
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            if (ws && input.value.trim()) {
                ws.send(JSON.stringify({ type: "CHAT", message: input.value.trim() }));
                input.value = "";
            }
        }

        function appendChatMessage(sender, message) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = "p-1 rounded text-slate-300";
            msgDiv.innerHTML = `<span class="font-bold text-slate-400">${sender}:</span> ${message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        initWebSocket();
    </script>
</body>
</html>
